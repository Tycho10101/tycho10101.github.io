name: Build and Deploy Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up build directory
        run: |
          mkdir -p build
          shopt -s extglob
          cp -r -- !(build) build/
          cd build
          rm -rf .git .github

      - name: Process HTML files
        run: |
          cd build

          # Find all HTML files except template.html and header.html
          for html_file in $(find . -name "*.html" -type f ! -name "template.html" ! -name "header.html"); do
            echo "Processing $html_file"

            # Extract content from <div class="blackground">... </div>
            extracted_content=$(cat "$html_file")

            # Initialize head_content with the default title
            head_content="<title>Tycho10101's Website</title>"

            # Check for a corresponding .head file
            head_file="${html_file}.head"
            if [ -f "$head_file" ]; then
              echo "Found head file: $head_file"
              # If a .head file exists, use its content
              head_content=$(cat "$head_file")
            fi

            # Read header.html if it exists
            header_content=""
            if [ -f "header.html" ]; then
              echo "Found header.html"
              header_content=$(cat "header.html")
            fi

            # Read template.html and substitute {%html%}, {%head%}, {%header%}, and {%domain%}
            if [ -f "template.html" ]; then
              # Create temporary file with substituted content
              awk -v html_content="$extracted_content" \
                  -v head_section="$head_content" \
                  -v header_section="$header_content" \
                  -v domain="https://tycho10101.is-a.dev/" '
                {
                  if ($0 ~ /{%html%}/) {
                    print html_content
                  } else if ($0 ~ /{%head%}/) {
                    print head_section
                  } else if ($0 ~ /{%header%}/) {
                    print header_section
                  } else if ($0 ~ /{%domain%}/) {
                    print domain
                  } else {
                    print $0
                  }
                }
              ' template.html > "${html_file}.tmp"
              cp "${html_file}.tmp" "$html_file"
              rm "${html_file}.tmp"
              echo "Updated $html_file"
            else
              echo "Error: template.html not found"
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          static_site_generator: none

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
